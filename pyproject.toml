[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econ-agent-sim"
version = "0.0.1"
description = "An educational, auditable agent-based economic simulator."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
app = ["streamlit==1.62.0", "starlette==1.6.0"]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
